experiment:
  name: gptrec-base-standard
  seed: 42
  mode: standard

paths:
  events: data/processed/gptrec_base/events.parquet
  manifest: data/processed/gptrec_base/manifest.json
  model_config: configs/gptrec_base.yaml
  checkpoint_dir: artifacts/checkpoints/gptrec_base_standard
  report_dir: reports/generated/gptrec_base_standard

training:
  epochs: 10
  train_batch_size: 32
  eval_batch_size: 256
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  log_every_steps: 100
  num_workers: 0
  early_stopping_patience: 2
  early_stopping_min_delta: 0.0001
  early_stopping_min_epochs: 3

evaluation:
  cutoffs: [5, 10, 20]
  filter_seen_items: true

