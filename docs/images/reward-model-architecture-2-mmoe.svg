<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Reward model architecture, part 2: MMoE</title>
  <desc id="desc">The shared 256-dimensional representation is processed by three common experts and separate task-specific gates and towers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title { font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a }
      .section { font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#334155 }
      .label { font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a }
      .body { font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569 }
      .mono { font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#334155 }
      .shared { fill:#fff7ed; stroke:#fdba74; stroke-width:2 }
      .expert { fill:#f5f3ff; stroke:#c4b5fd; stroke-width:2 }
      .gate { fill:#eff6ff; stroke:#93c5fd; stroke-width:2 }
      .tower { fill:#ecfdf5; stroke:#86efac; stroke-width:2 }
      .line { fill:none; stroke:#334155; stroke-width:2.2; marker-end:url(#arrow) }
      .soft { fill:none; stroke:#94a3b8; stroke-width:1.6 }
    </style>
  </defs>

  <rect width="1200" height="860" fill="#f8fafc"/>
  <path d="M600 0 L600 34" class="soft"/>
  <text x="60" y="62" class="title">2 · MMoE: общие experts, отдельные gates</text>
  <text x="60" y="92" class="body">Experts находят общие закономерности; каждая задача выбирает собственную смесь.</text>

  <rect x="390" y="122" width="420" height="76" rx="16" class="shared"/>
  <text x="600" y="153" text-anchor="middle" class="label">Shared representation</text>
  <text x="600" y="178" text-anchor="middle" class="mono">x ∈ R²⁵⁶</text>
  <path d="M600 34 L600 114" class="line"/>

  <text x="60" y="248" class="section">Три параллельных эксперта</text>
  <rect x="80" y="272" width="300" height="124" rx="16" class="expert"/>
  <text x="230" y="306" text-anchor="middle" class="label">Expert 1</text>
  <text x="230" y="334" text-anchor="middle" class="mono">Linear 256 → 256</text>
  <text x="230" y="360" text-anchor="middle" class="body">GELU · Dropout</text>
  <text x="230" y="382" text-anchor="middle" class="body">Специализация возникает при обучении</text>

  <rect x="450" y="272" width="300" height="124" rx="16" class="expert"/>
  <text x="600" y="306" text-anchor="middle" class="label">Expert 2</text>
  <text x="600" y="334" text-anchor="middle" class="mono">Linear 256 → 256</text>
  <text x="600" y="360" text-anchor="middle" class="body">GELU · Dropout</text>
  <text x="600" y="382" text-anchor="middle" class="body">Общий для всех outcomes</text>

  <rect x="820" y="272" width="300" height="124" rx="16" class="expert"/>
  <text x="970" y="306" text-anchor="middle" class="label">Expert 3</text>
  <text x="970" y="334" text-anchor="middle" class="mono">Linear 256 → 256</text>
  <text x="970" y="360" text-anchor="middle" class="body">GELU · Dropout</text>
  <text x="970" y="382" text-anchor="middle" class="body">Не задан вручную как эвристика</text>

  <path d="M600 198 C600 230 230 222 230 264" class="line"/>
  <path d="M600 198 L600 264" class="line"/>
  <path d="M600 198 C600 230 970 222 970 264" class="line"/>

  <rect x="370" y="438" width="460" height="70" rx="15" class="shared"/>
  <text x="600" y="467" text-anchor="middle" class="label">Expert stack</text>
  <text x="600" y="491" text-anchor="middle" class="mono">[E₁(x), E₂(x), E₃(x)] ∈ R³ˣ²⁵⁶</text>
  <path d="M230 396 C230 424 460 416 500 438" class="line"/>
  <path d="M600 396 L600 430" class="line"/>
  <path d="M970 396 C970 424 740 416 700 438" class="line"/>

  <text x="60" y="558" class="section">Task-specific gates и towers</text>
  <rect x="70" y="580" width="320" height="176" rx="16" class="gate"/>
  <text x="230" y="614" text-anchor="middle" class="label">Completion gate</text>
  <text x="230" y="641" text-anchor="middle" class="mono">softmax(Wc x) → 3 weights</text>
  <text x="230" y="668" text-anchor="middle" class="body">Взвешенная сумма experts</text>
  <rect x="112" y="696" width="236" height="42" rx="12" class="tower"/>
  <text x="230" y="722" text-anchor="middle" class="mono">tower: 256 → 128</text>

  <rect x="440" y="580" width="320" height="176" rx="16" class="gate"/>
  <text x="600" y="614" text-anchor="middle" class="label">Duration gate</text>
  <text x="600" y="641" text-anchor="middle" class="mono">softmax(Wd x) → 3 weights</text>
  <text x="600" y="668" text-anchor="middle" class="body">Собственная смесь experts</text>
  <rect x="482" y="696" width="236" height="42" rx="12" class="tower"/>
  <text x="600" y="722" text-anchor="middle" class="mono">tower: 256 → 128</text>

  <rect x="810" y="580" width="320" height="176" rx="16" class="gate"/>
  <text x="970" y="614" text-anchor="middle" class="label">Return gate</text>
  <text x="970" y="641" text-anchor="middle" class="mono">softmax(Wr x) → 3 weights</text>
  <text x="970" y="668" text-anchor="middle" class="body">Собственная смесь experts</text>
  <rect x="852" y="696" width="236" height="42" rx="12" class="tower"/>
  <text x="970" y="722" text-anchor="middle" class="mono">tower: 256 → 128</text>

  <path d="M600 508 C600 544 230 536 230 572" class="line"/>
  <path d="M600 508 L600 572" class="line"/>
  <path d="M600 508 C600 544 970 536 970 572" class="line"/>

  <path d="M230 756 C230 804 510 792 560 826" class="line"/>
  <path d="M600 756 L600 826" class="line"/>
  <path d="M970 756 C970 804 690 792 640 826" class="line"/>
  <path d="M600 826 L600 860" class="soft"/>
</svg>
