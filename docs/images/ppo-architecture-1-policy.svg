<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">PPO architecture part 1: state encoding and actor-critic policy</title>
  <desc id="desc">Item IDs and optional predicted feedback are embedded, processed by the GPTRec causal Transformer, and sent to actor and value heads. A frozen GPTRec copy remains the reference policy.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.section{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.label{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.mono{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}.input{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.item{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.feedback{fill:#fff7ed;stroke:#fdba74;stroke-width:2}.shared{fill:#f5f3ff;stroke:#c4b5fd;stroke-width:2}.actor{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.critic{fill:#fefce8;stroke:#fde047;stroke-width:2}.reference{fill:#ffffff;stroke:#64748b;stroke-width:2.2}.line{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}.dashed{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="920" fill="#f8fafc"/>
  <text x="60" y="60" class="title">1 · State encoding и общая actor-critic policy</text>
  <text x="60" y="90" class="body">Обе RL-конфигурации используют один класс модели и стартуют с одинаковых весов GPTRec-base.</text>

  <text x="60" y="138" class="section">Входное состояние</text>
  <rect x="70" y="160" width="300" height="126" rx="16" class="input"/>
  <text x="220" y="197" text-anchor="middle" class="label">Atomic item IDs</text>
  <text x="220" y="228" text-anchor="middle" class="mono">[i₁, i₂, …, iₜ]</text>
  <text x="220" y="256" text-anchor="middle" class="body">До 32 tokens · PAD = 0</text>
  <rect x="420" y="160" width="300" height="126" rx="16" class="feedback"/>
  <text x="570" y="197" text-anchor="middle" class="label">Feedback features</text>
  <text x="570" y="228" text-anchor="middle" class="mono">ŷ = [C, D, P(return)]</text>
  <text x="570" y="256" text-anchor="middle" class="body">Нули для observed history и slate mode</text>
  <rect x="770" y="160" width="360" height="126" rx="16" class="reference"/>
  <text x="950" y="197" text-anchor="middle" class="label">Attention mask</text>
  <text x="950" y="228" text-anchor="middle" class="mono">1 = observed/generated · 0 = PAD</text>
  <text x="950" y="256" text-anchor="middle" class="body">Последний непустой state используется policy</text>

  <text x="60" y="344" class="section">Embedding layer</text>
  <rect x="100" y="366" width="330" height="116" rx="16" class="item"/>
  <text x="265" y="403" text-anchor="middle" class="label">Shared GPTRec item embedding</text>
  <text x="265" y="434" text-anchor="middle" class="mono">e_item ∈ R¹²⁸</text>
  <text x="265" y="460" text-anchor="middle" class="body">Инициализирован из base checkpoint</text>
  <rect x="510" y="366" width="330" height="116" rx="16" class="feedback"/>
  <text x="675" y="403" text-anchor="middle" class="label">Feedback adapter</text>
  <text x="675" y="434" text-anchor="middle" class="mono">Linear(3 → 128), bias = false</text>
  <text x="675" y="460" text-anchor="middle" class="body">Weights = 0 при инициализации</text>
  <circle cx="465" cy="424" r="20" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="465" y="431" text-anchor="middle" class="label">+</text>
  <path d="M220 286 C220 330 265 326 265 358" class="line"/>
  <path d="M570 286 C570 330 675 326 675 358" class="line"/>
  <path d="M430 424 L437 424" class="line"/>
  <path d="M510 424 L493 424" class="line"/>

  <rect x="290" y="548" width="620" height="126" rx="18" class="shared"/>
  <text x="600" y="587" text-anchor="middle" class="label">Shared GPTRec causal Transformer</text>
  <text x="600" y="619" text-anchor="middle" class="mono">2 layers · hidden 128 · 4 attention heads</text>
  <text x="600" y="648" text-anchor="middle" class="body">Actor и critic обновляют общий representation</text>
  <path d="M465 444 C465 514 600 500 600 540" class="line"/>
  <path d="M950 286 C950 512 840 504 840 540" class="dashed"/>

  <text x="60" y="734" class="section">Две головы и неизменный reference</text>
  <rect x="70" y="756" width="310" height="112" rx="16" class="actor"/>
  <text x="225" y="792" text-anchor="middle" class="label">Actor / tied LM head</text>
  <text x="225" y="823" text-anchor="middle" class="mono">zθ(s) ∈ R^|catalogue|</text>
  <text x="225" y="850" text-anchor="middle" class="body">Распределение по item IDs</text>
  <rect x="445" y="756" width="310" height="112" rx="16" class="critic"/>
  <text x="600" y="792" text-anchor="middle" class="label">Value head</text>
  <text x="600" y="823" text-anchor="middle" class="mono">Linear(128 → 1) = Vψ(s)</text>
  <text x="600" y="850" text-anchor="middle" class="body">Baseline для GAE и value loss</text>
  <rect x="820" y="756" width="310" height="112" rx="16" class="reference"/>
  <text x="975" y="792" text-anchor="middle" class="label">Frozen GPTRec-base</text>
  <text x="975" y="823" text-anchor="middle" class="mono">πbase · requires_grad = false</text>
  <text x="975" y="850" text-anchor="middle" class="body">Top-M support и KL reference</text>
  <path d="M520 674 C520 718 225 712 225 748" class="line"/>
  <path d="M600 674 L600 748" class="line"/>
  <path d="M680 674 C680 718 975 712 975 748" class="dashed"/>
  <text x="600" y="900" text-anchor="middle" class="body">Zero-init adapter ⇒ до PPO actor logits совпадают с GPTRec-base</text>
</svg>
