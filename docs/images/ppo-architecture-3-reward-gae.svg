<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">PPO architecture part 3: reward normalization, discounting and GAE</title>
  <desc id="desc">Five calibrated reward models produce completion, duration, return and disagreement. Fixed base-policy statistics normalize each component before a weighted reward is accumulated and converted to advantages by GAE.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.section{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.label{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.mono{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}.seed{fill:#f5f3ff;stroke:#c4b5fd;stroke-width:2}.outcome{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.normalizer{fill:#fff7ed;stroke:#fdba74;stroke-width:2}.reward{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.value{fill:#fefce8;stroke:#fde047;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="940" fill="#f8fafc"/>
  <text x="60" y="60" class="title">3 · Reward normalization, discounting и GAE</text>
  <text x="60" y="90" class="body">Raw outcomes сохраняются для интерпретации; PPO получает фиксированно нормализованную цель.</text>
  <text x="60" y="138" class="section">Calibrated ensemble predictions для выбранного action</text>
  <rect x="70" y="160" width="190" height="92" rx="15" class="seed"/><text x="165" y="195" text-anchor="middle" class="label">RM seed 42</text><text x="165" y="224" text-anchor="middle" class="body">calibrated heads</text>
  <rect x="287" y="160" width="190" height="92" rx="15" class="seed"/><text x="382" y="195" text-anchor="middle" class="label">RM seed 43</text><text x="382" y="224" text-anchor="middle" class="body">calibrated heads</text>
  <rect x="505" y="160" width="190" height="92" rx="15" class="seed"/><text x="600" y="195" text-anchor="middle" class="label">RM seed 44</text><text x="600" y="224" text-anchor="middle" class="body">calibrated heads</text>
  <rect x="723" y="160" width="190" height="92" rx="15" class="seed"/><text x="818" y="195" text-anchor="middle" class="label">RM seed 45</text><text x="818" y="224" text-anchor="middle" class="body">calibrated heads</text>
  <rect x="940" y="160" width="190" height="92" rx="15" class="seed"/><text x="1035" y="195" text-anchor="middle" class="label">RM seed 46</text><text x="1035" y="224" text-anchor="middle" class="body">calibrated heads</text>
  <rect x="90" y="310" width="230" height="100" rx="16" class="outcome"/><text x="205" y="345" text-anchor="middle" class="label">Completion Cₜ</text><text x="205" y="376" text-anchor="middle" class="mono">mean expected utility</text><text x="205" y="398" text-anchor="middle" class="body">range [0, 1]</text>
  <rect x="350" y="310" width="230" height="100" rx="16" class="outcome"/><text x="465" y="345" text-anchor="middle" class="label">Duration Dₜ</text><text x="465" y="376" text-anchor="middle" class="mono">mean Beta expectation</text><text x="465" y="398" text-anchor="middle" class="body">range (0, 1)</text>
  <rect x="610" y="310" width="230" height="100" rx="16" class="outcome"/><text x="725" y="345" text-anchor="middle" class="label">Return Pₜ</text><text x="725" y="376" text-anchor="middle" class="mono">mean calibrated p</text><text x="725" y="398" text-anchor="middle" class="body">7-day proxy</text>
  <rect x="870" y="310" width="230" height="100" rx="16" class="outcome"/><text x="985" y="345" text-anchor="middle" class="label">Uncertainty Uₜ</text><text x="985" y="376" text-anchor="middle" class="mono">std core reward</text><text x="985" y="398" text-anchor="middle" class="body">ensemble disagreement</text>
  <path d="M165 252 C165 280 205 276 205 302" class="line"/><path d="M382 252 C382 280 465 276 465 302" class="line"/><path d="M600 252 C600 280 725 276 725 302" class="line"/><path d="M1035 252 C1035 280 985 276 985 302" class="line"/>
  <text x="60" y="468" class="section">Одна frozen шкала для обеих policy</text>
  <rect x="90" y="490" width="1020" height="132" rx="18" class="normalizer"/>
  <text x="600" y="526" text-anchor="middle" class="label">Base-policy calibration rollouts</text><text x="600" y="557" text-anchor="middle" class="mono">μx = mean_base(x)   ·   σx = std_base(x)</text><text x="600" y="588" text-anchor="middle" class="mono">zₓ = clip((x − μx) / max(σx, 10⁻⁴), −5, 5)</text><text x="600" y="612" text-anchor="middle" class="body">Статистики сохраняются в checkpoint и не обновляются из PPO minibatches</text>
  <path d="M205 410 C205 454 390 446 420 482" class="line"/><path d="M985 410 C985 454 810 446 780 482" class="line"/>
  <rect x="130" y="676" width="940" height="104" rx="18" class="reward"/>
  <text x="600" y="712" text-anchor="middle" class="label">Immediate normalized reward</text><text x="600" y="744" text-anchor="middle" class="mono">rₜ = 0.55zCₜ + 0.30zDₜ + 0.15zPₜ − 0.25zUₜ</text><text x="600" y="768" text-anchor="middle" class="body">Raw reward той же формулы без z-score записывается отдельно в отчёт</text>
  <path d="M600 622 L600 668" class="line"/>
  <rect x="90" y="834" width="490" height="82" rx="16" class="value"/><text x="335" y="866" text-anchor="middle" class="label">Discounted return</text><text x="335" y="896" text-anchor="middle" class="mono">Gₜ = Σₖ₌ₜᴴ γᵏ⁻ᵗ rₖ · γ = 0.9</text>
  <rect x="620" y="834" width="490" height="82" rx="16" class="value"/><text x="865" y="866" text-anchor="middle" class="label">Generalized advantage estimate</text><text x="865" y="896" text-anchor="middle" class="mono">Aₜ = Σₗ (γλ)ˡ δₜ₊ₗ · λ = 0.95</text>
  <path d="M520 780 C520 812 335 806 335 826" class="line"/><path d="M680 780 C680 812 865 806 865 826" class="line"/>
</svg>
