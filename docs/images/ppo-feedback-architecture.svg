<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">PPO multi-step feedback architecture</title>
  <desc id="desc">GPTRec actor selects an item, the reward ensemble predicts completion, duration and return, and a feedback adapter conditions the next simulated state. PPO optimizes discounted model-based returns with KL regularization.</desc>
  <defs>
    <linearGradient id="gray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eff9ff"/><stop offset="1" stop-color="#c9ecff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f0ff"/><stop offset="1" stop-color="#ded1ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ebffed"/><stop offset="1" stop-color="#c9f4cf"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8eb"/><stop offset="1" stop-color="#ffdfad"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#64748b" flood-opacity="0.16"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0877d1"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#079447"/></marker>
    <style>
      .heading{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0b1746}.label{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.body{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172554}.small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.math{font:italic 18px Georgia,"Times New Roman",serif;fill:#111827}.panel{stroke-width:2;filter:url(#shadow)}.inner{fill:#fff;fill-opacity:.55;stroke-width:1.6}.line{fill:none;stroke:#0877d1;stroke-width:3;marker-end:url(#arrow)}.reward-line{fill:none;stroke:#079447;stroke-width:3;marker-end:url(#green-arrow)}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="800" fill="#ffffff"/>
  <text x="48" y="58" class="heading">PPO multi-step · model-based feedback rollout</text>

  <rect x="38" y="108" width="270" height="250" rx="14" fill="url(#gray)" stroke="#94a3b8" class="panel"/>
  <text x="173" y="150" text-anchor="middle" class="label">State sₜ</text>
  <text x="173" y="187" text-anchor="middle" class="math">[history, (a, ŷ)₁ … (a, ŷ)ₜ₋₁]</text>
  <rect x="66" y="219" width="214" height="98" rx="9" class="inner" stroke="#94a3b8"/>
  <text x="173" y="249" text-anchor="middle" class="body">item embedding</text>
  <text x="173" y="276" text-anchor="middle" class="body">+ feedback adapter</text>
  <text x="173" y="301" text-anchor="middle" class="small">ŷ = [C, D, P(return)]</text>

  <rect x="362" y="90" width="300" height="284" rx="16" fill="url(#purple)" stroke="#7544d6" stroke-width="4" filter="url(#shadow)"/>
  <text x="512" y="133" text-anchor="middle" class="heading">GPTRec actor-critic</text>
  <text x="512" y="165" text-anchor="middle" class="body">base weights + zero-init adapter</text>
  <rect x="392" y="194" width="240" height="64" rx="9" class="inner" stroke="#8157dc"/>
  <text x="512" y="222" text-anchor="middle" class="label">Causal Transformer</text>
  <text x="512" y="246" text-anchor="middle" class="small">feedback-aware hidden state</text>
  <rect x="392" y="276" width="112" height="70" rx="9" class="inner" stroke="#8157dc"/>
  <text x="448" y="305" text-anchor="middle" class="body">Actor</text><text x="448" y="330" text-anchor="middle" class="math">πθ</text>
  <rect x="520" y="276" width="112" height="70" rx="9" class="inner" stroke="#8157dc"/>
  <text x="576" y="305" text-anchor="middle" class="body">Critic</text><text x="576" y="330" text-anchor="middle" class="math">Vψ</text>
  <path d="M308 233 L354 233" class="line"/>

  <rect x="362" y="434" width="300" height="142" rx="14" fill="url(#blue)" stroke="#1688df" class="panel"/>
  <text x="512" y="473" text-anchor="middle" class="label">Frozen GPTRec-base</text>
  <text x="512" y="506" text-anchor="middle" class="body">top-M candidates + KL reference</text>
  <text x="512" y="539" text-anchor="middle" class="small">не использует simulated feedback</text>
  <path d="M512 426 L512 382" class="dash"/>

  <rect x="724" y="126" width="238" height="214" rx="14" fill="url(#blue)" stroke="#1688df" class="panel"/>
  <text x="843" y="168" text-anchor="middle" class="label">Action aₜ</text>
  <text x="843" y="203" text-anchor="middle" class="math">aₜ ~ πθ(· | sₜ, C(sₜ))</text>
  <rect x="752" y="237" width="182" height="62" rx="9" class="inner" stroke="#1688df"/>
  <text x="843" y="264" text-anchor="middle" class="body">atomic item ID</text>
  <text x="843" y="287" text-anchor="middle" class="small">seen items masked</text>
  <path d="M662 233 L716 233" class="line"/>

  <rect x="1020" y="90" width="304" height="284" rx="14" fill="url(#green)" stroke="#3cbd68" class="panel"/>
  <text x="1172" y="133" text-anchor="middle" class="heading">RM feedback model</text>
  <text x="1172" y="169" text-anchor="middle" class="body">ensemble mean + disagreement</text>
  <rect x="1048" y="199" width="248" height="72" rx="9" class="inner" stroke="#079447"/>
  <text x="1172" y="227" text-anchor="middle" class="label">Predicted outcome ŷₜ</text>
  <text x="1172" y="254" text-anchor="middle" class="math">[Cₜ, Dₜ, P(return)ₜ]</text>
  <rect x="1048" y="288" width="248" height="58" rx="9" class="inner" stroke="#079447"/>
  <text x="1172" y="313" text-anchor="middle" class="body">normalized rₜ</text>
  <text x="1172" y="336" text-anchor="middle" class="small">uncertainty penalty Uₜ</text>
  <path d="M962 233 L1012 233" class="reward-line"/>

  <rect x="1380" y="108" width="182" height="250" rx="14" fill="url(#orange)" stroke="#e59a21" class="panel"/>
  <text x="1471" y="150" text-anchor="middle" class="label">Transition</text>
  <text x="1471" y="190" text-anchor="middle" class="math">sₜ₊₁</text>
  <text x="1471" y="222" text-anchor="middle" class="body">append aₜ</text>
  <text x="1471" y="250" text-anchor="middle" class="body">append ŷₜ</text>
  <text x="1471" y="291" text-anchor="middle" class="small">learned model,</text>
  <text x="1471" y="314" text-anchor="middle" class="small">не observed feedback</text>
  <path d="M1324 233 L1372 233" class="reward-line"/>
  <path d="M1471 358 C1471 408 173 397 173 366" class="dash"/>

  <rect x="194" y="634" width="1212" height="108" rx="14" fill="url(#orange)" stroke="#e59a21" class="panel"/>
  <text x="800" y="670" text-anchor="middle" class="label">Discounted model-based return and PPO update</text>
  <text x="800" y="703" text-anchor="middle" class="math">Gₜ = Σₖ γᵏ⁻ᵗ rₖ    ·    L = Lclip + cᵥLvalue − cₕEntropy + β KL(πRL || πbase)</text>
  <text x="800" y="728" text-anchor="middle" class="small">H = 5 · γ = 0.9 · GAE λ = 0.95</text>
  <path d="M1172 374 C1172 594 1010 590 1010 626" class="reward-line"/>
  <path d="M512 576 C512 604 610 600 610 626" class="line"/>

  <rect x="1034" y="434" width="490" height="142" rx="14" fill="url(#gray)" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1279" y="472" text-anchor="middle" class="label">Интерпретация</text>
  <text x="1279" y="506" text-anchor="middle" class="body">model-based sensitivity experiment</text>
  <text x="1279" y="536" text-anchor="middle" class="small">KION не содержит impressions, skips и behavior propensities</text>
</svg>
