<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
  <title id="title">PPO architecture part 4: optimization, checkpoint selection and evaluation</title>
  <desc id="desc">Old policy probabilities form PPO ratios, the critic fits returns, the frozen base policy supplies KL regularization, and checkpoints are selected under an NDCG constraint before one final test evaluation.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.section{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155}.label{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}.mono{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}.old{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.actor{fill:#f5f3ff;stroke:#c4b5fd;stroke-width:2}.critic{fill:#fefce8;stroke:#fde047;stroke-width:2}.reference{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.loss{fill:#ecfdf5;stroke:#86efac;stroke-width:2}.selection{fill:#fff7ed;stroke:#fdba74;stroke-width:2}.test{fill:#ffffff;stroke:#64748b;stroke-width:2.2}.warning{fill:#fef2f2;stroke:#fca5a5;stroke-width:2}.line{fill:none;stroke:#334155;stroke-width:2.2;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="950" fill="#f8fafc"/>
  <text x="60" y="60" class="title">4 · PPO loss, checkpoint selection и offline evaluation</text>
  <text x="60" y="90" class="body">πold стабилизирует локальный update; πbase ограничивает накопленное отклонение от исходного рекомендателя.</text>
  <text x="60" y="138" class="section">Три распределения и critic targets</text>
  <rect x="70" y="160" width="245" height="126" rx="16" class="old"/><text x="192" y="197" text-anchor="middle" class="label">Rollout policy πold</text><text x="192" y="228" text-anchor="middle" class="mono">log πold(aₜ | sₜ)</text><text x="192" y="257" text-anchor="middle" class="body">Сохранено при sampling</text>
  <rect x="335" y="160" width="245" height="126" rx="16" class="actor"/><text x="457" y="197" text-anchor="middle" class="label">Updated actor πθ</text><text x="457" y="228" text-anchor="middle" class="mono">log πθ(aₜ | sₜ)</text><text x="457" y="257" text-anchor="middle" class="body">Пересчёт на minibatch</text>
  <rect x="600" y="160" width="245" height="126" rx="16" class="reference"/><text x="722" y="197" text-anchor="middle" class="label">Frozen πbase</text><text x="722" y="228" text-anchor="middle" class="mono">log πbase(· | sₜ)</text><text x="722" y="257" text-anchor="middle" class="body">Exact KL на top-M</text>
  <rect x="865" y="160" width="265" height="126" rx="16" class="critic"/><text x="997" y="197" text-anchor="middle" class="label">Critic</text><text x="997" y="228" text-anchor="middle" class="mono">Vψ(sₜ) ↔ Âₜ + Vold(sₜ)</text><text x="997" y="257" text-anchor="middle" class="body">MSE к finite-horizon return</text>
  <text x="60" y="346" class="section">Составные части objective</text>
  <rect x="70" y="368" width="500" height="124" rx="16" class="actor"/><text x="320" y="404" text-anchor="middle" class="label">Clipped policy surrogate</text><text x="320" y="436" text-anchor="middle" class="mono">ρₜ = exp(log πθ − log πold)</text><text x="320" y="466" text-anchor="middle" class="mono">Lclip = −min(ρₜAₜ, clip(ρₜ, 1±ε)Aₜ)</text>
  <rect x="630" y="368" width="500" height="124" rx="16" class="reference"/><text x="880" y="404" text-anchor="middle" class="label">Reference regularization</text><text x="880" y="436" text-anchor="middle" class="mono">KL = Σₐ πθ(a|s)[log πθ − log πbase]</text><text x="880" y="466" text-anchor="middle" class="body">Не заменяется PPO clipping</text>
  <path d="M192 286 C192 328 270 324 270 360" class="line"/><path d="M457 286 C457 328 370 324 370 360" class="line"/><path d="M722 286 C722 328 880 324 880 360" class="line"/>
  <rect x="130" y="548" width="940" height="112" rx="18" class="loss"/><text x="600" y="585" text-anchor="middle" class="label">Minimized PPO objective</text><text x="600" y="619" text-anchor="middle" class="mono">L = Lclip + 0.5 Lvalue − 0.01 H(πθ) + 0.05 KL(πθ || πbase)</text><text x="600" y="646" text-anchor="middle" class="body">4 PPO epochs · ε = 0.2 · gradient clipping = 1.0 · learning rate = 10⁻⁵</text>
  <path d="M320 492 C320 530 520 520 540 540" class="line"/><path d="M880 492 C880 530 680 520 660 540" class="line"/><path d="M997 286 C997 526 800 514 740 540" class="line"/>
  <text x="60" y="720" class="section">Calibration selection → один test выбранной policy</text>
  <rect x="70" y="742" width="330" height="116" rx="16" class="old"/><text x="235" y="777" text-anchor="middle" class="label">Base constraint</text><text x="235" y="808" text-anchor="middle" class="mono">NDCG_policy ≥ 0.90 NDCG_base</text><text x="235" y="837" text-anchor="middle" class="body">Считается на calibration</text>
  <rect x="435" y="742" width="330" height="116" rx="16" class="selection"/><text x="600" y="777" text-anchor="middle" class="label">Best eligible checkpoint</text><text x="600" y="808" text-anchor="middle" class="mono">max(normalized reward − βKL)</text><text x="600" y="837" text-anchor="middle" class="body">Отдельно для slate и feedback</text>
  <rect x="800" y="742" width="330" height="116" rx="16" class="test"/><text x="965" y="777" text-anchor="middle" class="label">Final test</text><text x="965" y="807" text-anchor="middle" class="body">Recall · NDCG · reward · KL · entropy</text><text x="965" y="834" text-anchor="middle" class="body">coverage · popularity · ILD · repeats</text>
  <path d="M400 800 L427 800" class="line"/><path d="M765 800 L792 800" class="line"/>
  <rect x="70" y="884" width="1060" height="48" rx="14" class="warning"/><text x="600" y="914" text-anchor="middle" class="body">RM reward — proxy objective: без impressions нельзя считать improvement causal или применять корректный IPS/DR</text>
</svg>
