[project]
name = "t-bank-recsys-lab"
version = "0.1.0"
description = "T-Lab RecSys experiments with an atomic-item GPTRec baseline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<24",
    "pyyaml>=6.0,<7",
    "torch>=2.4,<3",
    "transformers>=4.45,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gptrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

